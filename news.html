<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSE Tracker - News</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0a1a1a; color: #e0e0e0; min-height: 100vh; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 4px; font-size: 1.8rem; color: #0ABAB5; }
        .subtitle { text-align: center; color: #7fb8b6; margin-bottom: 24px; font-size: 0.9rem; }
        .nav-links { display: flex; justify-content: center; gap: 10px; margin-bottom: 28px; flex-wrap: wrap; }
        .nav-link { color: #7fb8b6; font-size: 0.85rem; border: 1px solid #1a3a3a; padding: 5px 14px; border-radius: 20px; transition: all 0.2s; background: none; cursor: pointer; }
        .nav-link:hover { border-color: #0ABAB5; color: #0ABAB5; }
        .nav-link.active { border-color: #0ABAB5; color: #0ABAB5; background: rgba(10,186,181,0.1); }
        .card { background: #0e2626; border: 1px solid #1a3a3a; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
        .card-title { font-size: 1.1rem; font-weight: bold; color: #0ABAB5; }
        .add-btn { background: rgba(10,186,181,0.15); color: #0ABAB5; border: 1px solid #0ABAB5; padding: 6px 14px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; font-weight: bold; }
        .add-btn:hover { background: #0ABAB5; color: #0a1a1a; }
        .add-btn:disabled { opacity: 0.5; cursor: default; }
        .news-group { margin-bottom: 18px; }
        .news-group:last-child { margin-bottom: 0; }
        .news-symbol { font-weight: bold; color: #fff; font-size: 0.95rem; margin-bottom: 8px; }
        .news-symbol span { color: #456a68; font-weight: normal; font-size: 0.8rem; }
        .news-item { padding: 10px 14px; background: #0a1a1a; border-radius: 8px; border: 1px solid #163030; margin-bottom: 6px; }
        .news-item a { color: #e0e0e0; text-decoration: none; font-size: 0.88rem; }
        .news-item a:hover { color: #0ABAB5; }
        .news-meta { color: #456a68; font-size: 0.72rem; margin-top: 4px; }
        .empty { color: #456a68; text-align: center; padding: 30px 0; font-size: 0.9rem; }
    </style>
</head>
<body>
<div class="container">
    <h1>Tokyo Stock Exchange</h1>
    <p class="subtitle">News Digest</p>
    <div class="nav-links">
        <button class="nav-link" onclick="navigate('portfolio')">Portfolio</button>
        <button class="nav-link" onclick="navigate('growth')">Growth</button>
        <button class="nav-link" onclick="navigate('history')">History</button>
        <button class="nav-link" onclick="navigate('watchlist')">Watchlist</button>
        <button class="nav-link" onclick="navigate('calendar')">Calendar</button>
        <button class="nav-link active" onclick="navigate('news')">News</button>
    </div>

    <div class="card">
        <div class="card-header">
            <div class="card-title">Last 36 hours</div>
            <button class="add-btn" id="emailBtn" onclick="sendTestEmail()">Email me this digest</button>
        </div>
        <div id="newsGroups"><div class="empty">Loading...</div></div>
    </div>
</div>

<script>
function gasRun(fnName) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function(resolve, reject) {
        var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
        runner[fnName].apply(runner, args);
    });
}

function timeAgo(ms) {
    var diff = Date.now() - ms;
    var hours = Math.floor(diff / 3600000);
    if (hours < 1) return "just now";
    if (hours < 24) return hours + "h ago";
    return Math.floor(hours / 24) + "d ago";
}

function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function(c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
}

async function init() {
    try {
        var groups = await gasRun('getNewsDigestFromClient', 36);
        var container = document.getElementById('newsGroups');
        if (!groups || groups.length === 0) {
            container.innerHTML = '<div class="empty">No fresh headlines in the last 36 hours for your portfolio or watchlist.</div>';
            return;
        }
        container.innerHTML = groups.map(function(g) {
            var items = g.items.map(function(n) {
                return '<div class="news-item">' +
                    '<a href="' + n.link + '" target="_blank" rel="noopener">' + escapeHtml(n.title) + '</a>' +
                    '<div class="news-meta">' + escapeHtml(n.publisher) + ' &middot; ' + timeAgo(n.time) + '</div>' +
                    '</div>';
            }).join('');
            return '<div class="news-group">' +
                '<div class="news-symbol">' + escapeHtml(g.name) + ' <span>(' + escapeHtml(g.symbol) + ')</span></div>' +
                items +
                '</div>';
        }).join('');
    } catch (err) {
        document.getElementById('newsGroups').innerHTML = '<div class="empty">Failed to load news: ' + escapeHtml(err.message || err) + '</div>';
    }
}

async function sendTestEmail() {
    var btn = document.getElementById('emailBtn');
    btn.disabled = true;
    btn.textContent = 'Sending...';
    try {
        await gasRun('sendNewsDigestEmailFromClient');
        btn.textContent = 'Sent!';
    } catch (err) {
        btn.textContent = 'Failed';
    }
    setTimeout(function() { btn.disabled = false; btn.textContent = 'Email me this digest'; }, 2000);
}

var _baseUrl = '';
function initNav() {
    gasRun('getDeploymentUrl').then(function(url) { _baseUrl = url; }).catch(function() { _baseUrl = ''; });
}
function navigate(page) {
    var url = _baseUrl || window.top.location.href.split('?')[0];
    window.top.location.href = url + '?page=' + page;
}
initNav();
init();
</script>
</body>
</html>
