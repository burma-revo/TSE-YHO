<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSE Tracker - Calendar</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #050b14; color: #e0e0e0; min-height: 100vh; padding: 20px; position: relative; }
        body::before, body::after { content: ''; position: fixed; width: 280px; height: 280px; border-radius: 50%; z-index: -1; pointer-events: none; }
        body::before { top: -100px; right: -100px; background: radial-gradient(circle, rgba(0,255,220,0.10), transparent 70%); }
        body::after { bottom: -100px; left: -100px; background: radial-gradient(circle, rgba(120,80,255,0.08), transparent 70%); }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 4px; font-size: 1.8rem; letter-spacing: 1px; background: linear-gradient(90deg, #00ffdd, #7f7bff); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .subtitle { text-align: center; color: #5ad9c9; margin-bottom: 24px; font-size: 0.85rem; letter-spacing: 1px; text-transform: uppercase; }
        .nav-links { display: flex; justify-content: center; gap: 10px; margin-bottom: 28px; flex-wrap: wrap; }
        .nav-link { color: #7fb8b6; font-size: 0.85rem; border: 1px solid rgba(223,247,242,0.12); padding: 5px 14px; border-radius: 20px; transition: all 0.2s; background: none; cursor: pointer; }
        .nav-link:hover { border-color: #00ffdd; color: #00ffdd; }
        .nav-link.active { border-color: rgba(0,255,220,0.5); color: #00ffdd; background: rgba(0,255,220,0.08); box-shadow: 0 0 10px rgba(0,255,220,0.25); }
        .card { background: rgba(255,255,255,0.03); border: 1px solid rgba(0,255,220,0.2); border-radius: 14px; padding: 20px; margin-bottom: 20px; backdrop-filter: blur(6px); box-shadow: 0 0 24px rgba(0,255,220,0.05); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
        .card-title { font-size: 1.1rem; font-weight: bold; color: #00ffdd; text-shadow: 0 0 8px rgba(0,255,220,0.3); }
        .header-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .view-toggle { display: flex; border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; overflow: hidden; }
        .view-toggle button { background: none; border: none; color: #7fb8b6; padding: 6px 14px; font-size: 0.82rem; cursor: pointer; font-weight: bold; }
        .view-toggle button.active { background: linear-gradient(90deg, #00ffdd, #00c9a8); color: #04342c; }
        .add-btn, .refresh-btn { border-radius: 6px; font-size: 0.85rem; cursor: pointer; font-weight: bold; padding: 6px 14px; }
        .add-btn { background: rgba(0,255,220,0.1); color: #00ffdd; border: 1px solid rgba(0,255,220,0.5); box-shadow: 0 0 8px rgba(0,255,220,0.15); }
        .add-btn:hover { background: linear-gradient(90deg, #00ffdd, #00c9a8); color: #04342c; }
        .refresh-btn { background: none; color: #7fb8b6; border: 1px solid rgba(255,255,255,0.1); }
        .refresh-btn:hover { border-color: #00ffdd; color: #00ffdd; }
        .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .filter-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
        .filter-btn { background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; color: #7fb8b6; cursor: pointer; padding: 4px 12px; font-size: 0.8rem; transition: all 0.2s; }
        .filter-btn:hover { border-color: #00ffdd; color: #00ffdd; }
        .filter-btn.active { background: linear-gradient(90deg, #00ffdd, #00c9a8); border-color: transparent; color: #04342c; font-weight: bold; box-shadow: 0 0 10px rgba(0,255,220,0.25); }
        .rows { max-height: 520px; overflow-y: auto; }
        .rows::-webkit-scrollbar { width: 6px; }
        .rows::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 3px; }
        .rows::-webkit-scrollbar-thumb { background: rgba(0,255,220,0.3); border-radius: 3px; }
        .kd-row { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; padding: 12px 14px; background: rgba(0,0,0,0.25); border-radius: 10px; border: 1px solid rgba(255,255,255,0.06); margin-bottom: 8px; align-items: center; transition: border-color 0.2s, box-shadow 0.2s; }
        .kd-row:hover { border-color: rgba(0,255,220,0.3); box-shadow: 0 0 10px rgba(0,255,220,0.08); }
        .kd-badge { font-size: 0.7rem; font-weight: bold; padding: 5px 8px; border-radius: 6px; text-align: center; white-space: nowrap; }
        .kd-badge.earnings { background: rgba(0,255,220,0.1); color: #00ffdd; box-shadow: 0 0 6px rgba(0,255,220,0.15); }
        .kd-badge.dividend, .kd-badge.exdividend { background: rgba(255,179,71,0.12); color: #ffb347; box-shadow: 0 0 6px rgba(255,179,71,0.15); }
        .kd-badge.yutai { background: rgba(217,139,255,0.12); color: #d98bff; box-shadow: 0 0 6px rgba(217,139,255,0.15); }
        .kd-badge.custom { background: rgba(255,255,255,0.06); color: #8fd4d1; }
        .kd-mid { min-width: 0; }
        .kd-name { font-weight: bold; color: #fff; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .kd-meta { font-size: 0.75rem; color: #7fb8b6; margin-top: 2px; display: flex; gap: 8px; flex-wrap: wrap; }
        .kd-note { font-size: 0.75rem; color: #456a68; margin-top: 2px; }
        .kd-source-auto { color: #456a68; }
        .kd-right { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
        .kd-date { font-family: 'Consolas', 'Courier New', monospace; font-weight: bold; font-size: 0.9rem; color: #fff; }
        .kd-countdown { font-size: 0.72rem; }
        .kd-countdown.soon { color: #ffb347; }
        .kd-countdown.today { color: #00ffdd; text-shadow: 0 0 6px rgba(0,255,220,0.3); }
        .kd-countdown.past { color: #456a68; }
        .kd-actions { display: flex; gap: 4px; margin-top: 2px; }
        .kd-btn { background: none; border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: #7fb8b6; cursor: pointer; padding: 3px 8px; font-size: 0.7rem; }
        .kd-btn:hover { border-color: #00ffdd; color: #00ffdd; box-shadow: 0 0 8px rgba(0,255,220,0.2); }
        .kd-btn.del:hover { border-color: #ff5c7a; color: #ff5c7a; box-shadow: 0 0 8px rgba(255,60,90,0.2); }
        .empty { color: #456a68; text-align: center; padding: 30px 0; font-size: 0.9rem; line-height: 1.7; }

        .month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
        .month-nav-btn { background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.08); border-radius: 6px; color: #7fb8b6; cursor: pointer; padding: 6px 12px; font-size: 0.9rem; }
        .month-nav-btn:hover { border-color: #00ffdd; color: #00ffdd; }
        .month-label { font-size: 1rem; font-weight: bold; color: #8fd4d1; text-align: center; }
        .month-today-btn { font-size: 0.75rem; color: #456a68; background: none; border: none; cursor: pointer; text-decoration: underline; display: block; margin: 2px auto 0; }
        .month-today-btn:hover { color: #00ffdd; }
        .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .month-dow { text-align: center; font-size: 0.7rem; color: #456a68; padding-bottom: 6px; font-weight: bold; }
        .month-cell { min-height: 64px; background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.06); border-radius: 8px; padding: 4px; cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s; display: flex; flex-direction: column; }
        .month-cell:hover { border-color: rgba(0,255,220,0.3); box-shadow: 0 0 8px rgba(0,255,220,0.08); }
        .month-cell.other-month { opacity: 0.35; }
        .month-cell.today { border-color: rgba(0,255,220,0.5); background: rgba(0,255,220,0.06); box-shadow: 0 0 10px rgba(0,255,220,0.1); }
        .month-cell.selected { border-color: rgba(0,255,220,0.6); background: rgba(0,255,220,0.15); box-shadow: 0 0 12px rgba(0,255,220,0.15); }
        .month-daynum { font-size: 0.75rem; color: #7fb8b6; margin-bottom: 3px; }
        .month-cell.today .month-daynum { color: #00ffdd; font-weight: bold; }
        .month-dots { display: flex; flex-wrap: wrap; gap: 2px; }
        .month-dot { width: 6px; height: 6px; border-radius: 50%; }
        .dot-earnings { background: #00ffdd; box-shadow: 0 0 4px rgba(0,255,220,0.6); }
        .dot-dividend, .dot-exdividend { background: #ffb347; box-shadow: 0 0 4px rgba(255,179,71,0.6); }
        .dot-yutai { background: #d98bff; box-shadow: 0 0 4px rgba(217,139,255,0.6); }
        .dot-custom { background: #8fd4d1; }
        .month-legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 14px; font-size: 0.75rem; color: #7fb8b6; }
        .month-legend span { display: flex; align-items: center; gap: 5px; }
        .day-detail-card { margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.08); }
        .day-detail-title { font-size: 0.9rem; font-weight: bold; color: #8fd4d1; margin-bottom: 10px; }

        .modal-overlay { display: none; position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.75); z-index: 1000; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(3px); }
        .modal-overlay.active { display: flex; }
        .modal { background: rgba(10,20,25,0.9); border: 1px solid rgba(0,255,220,0.25); border-radius: 14px; padding: 24px; width: 100%; max-width: 420px; backdrop-filter: blur(8px); box-shadow: 0 0 30px rgba(0,255,220,0.1); }
        .modal-title { font-size: 1.1rem; font-weight: bold; color: #00ffdd; margin-bottom: 18px; text-shadow: 0 0 8px rgba(0,255,220,0.3); }
        .modal-field { margin-bottom: 12px; }
        .modal-field label { display: block; color: #7fb8b6; font-size: 0.8rem; margin-bottom: 4px; }
        .modal-field input, .modal-field select, .modal-field textarea { width: 100%; padding: 9px 12px; border: 1px solid rgba(0,255,220,0.15); border-radius: 8px; background: rgba(0,0,0,0.3); color: #e0e0e0; font-size: 0.9rem; font-family: inherit; }
        .modal-field input:focus, .modal-field select:focus, .modal-field textarea:focus { border-color: #00ffdd; box-shadow: 0 0 8px rgba(0,255,220,0.15); outline: none; }
        .modal-field textarea { resize: vertical; min-height: 50px; }
        .checkbox-field { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
        .checkbox-field input { width: auto; }
        .checkbox-field label { color: #7fb8b6; font-size: 0.85rem; margin-bottom: 0; }
        .modal-buttons { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
        .modal-btn { padding: 9px 18px; border-radius: 8px; font-size: 0.88rem; cursor: pointer; font-weight: bold; border: none; }
        .modal-btn.primary { background: linear-gradient(90deg, #00ffdd, #00c9a8); color: #04342c; box-shadow: 0 0 12px rgba(0,255,220,0.25); }
        .modal-btn.secondary { background: rgba(255,255,255,0.06); color: #7fb8b6; }
        @media (max-width: 600px) {
            .kd-row { grid-template-columns: 1fr; }
            .kd-right { align-items: flex-start; }
            .month-cell { min-height: 46px; }
            .month-daynum { font-size: 0.68rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Tokyo Stock Exchange</h1>
    <p class="subtitle">Calendar</p>
    <div class="nav-links">
        <button class="nav-link" onclick="navigate('portfolio')">Portfolio</button>
        <button class="nav-link" onclick="navigate('growth')">Growth</button>
        <button class="nav-link" onclick="navigate('history')">History</button>
        <button class="nav-link" onclick="navigate('watchlist')">Watchlist</button>
        <button class="nav-link active" onclick="navigate('calendar')">Calendar</button>
    </div>

    <div class="card">
        <div class="card-header">
            <div class="card-title">Key Dates</div>
            <div class="header-actions">
                <div class="view-toggle">
                    <button id="viewListBtn" class="active" onclick="setView('list')">List</button>
                    <button id="viewMonthBtn" onclick="setView('month')">Month</button>
                </div>
                <button class="refresh-btn" id="refreshBtn" onclick="refreshFromPortfolio()">&#8635; Refresh</button>
                <button class="add-btn" onclick="openAddModal()">+ Add date</button>
            </div>
        </div>

        <div id="listView">
            <div class="filter-row" id="filterRow"></div>
            <div class="rows" id="kdRows"><div class="empty">Loading...</div></div>
        </div>

        <div id="monthView" style="display:none;">
            <div class="month-nav">
                <button class="month-nav-btn" onclick="shiftMonth(-1)">&#8249;</button>
                <div>
                    <div class="month-label" id="monthLabel">--</div>
                    <button class="month-today-btn" onclick="goToday()">Today</button>
                </div>
                <button class="month-nav-btn" onclick="shiftMonth(1)">&#8250;</button>
            </div>
            <div class="month-grid" id="monthGrid"></div>
            <div class="month-legend">
                <span><div class="month-dot dot-earnings"></div>Earnings</span>
                <span><div class="month-dot dot-dividend"></div>Dividend</span>
                <span><div class="month-dot dot-yutai"></div>&#20778;&#24575;</span>
                <span><div class="month-dot dot-custom"></div>Custom</span>
            </div>
            <div class="day-detail-card" id="dayDetailCard" style="display:none;">
                <div class="day-detail-title" id="dayDetailTitle"></div>
                <div id="dayDetailRows"></div>
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="addModal">
    <div class="modal">
        <div class="modal-title">Add key date</div>
        <div class="modal-field">
            <label>Stock</label>
            <select id="kdSymbol"></select>
        </div>
        <div class="modal-field">
            <label>Type</label>
            <select id="kdType">
                <option value="earnings">Earnings</option>
                <option value="dividend">Dividend</option>
                <option value="exdividend">Ex-Dividend</option>
                <option value="yutai">Yutai (&#20778;&#24575;)</option>
                <option value="custom">Custom</option>
            </select>
        </div>
        <div class="modal-field">
            <label>Date</label>
            <input type="date" id="kdDate">
        </div>
        <div class="modal-field">
            <label>Note (optional)</label>
            <textarea id="kdNote" placeholder="e.g. QoQ earnings call, minimum 100 shares for benefit"></textarea>
        </div>
        <div class="checkbox-field">
            <input type="checkbox" id="kdPushCal" checked>
            <label for="kdPushCal">Also add to Google Calendar</label>
        </div>
        <div class="modal-buttons">
            <button class="modal-btn secondary" onclick="closeAddModal()">Cancel</button>
            <button class="modal-btn primary" onclick="saveKeyDate()">Add</button>
        </div>
    </div>
</div>

<script>
function gasRun(fnName) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function(resolve, reject) {
        var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
        runner[fnName].apply(runner, args);
    });
}

var allKeyDates = [];
var portfolio = [];
var currentFilter = 'all';
var currentView = 'list';
var monthCursor = new Date(); monthCursor.setDate(1);
var selectedDay = null;

var TYPE_LABELS = { earnings: 'Earnings', dividend: 'Dividend', exdividend: 'Ex-Dividend', yutai: '\u512A\u5F85', custom: 'Custom' };

async function init() {
    try {
        var results = await Promise.all([
            gasRun('getAllKeyDatesFromClient'),
            gasRun('getAllPositions')
        ]);
        allKeyDates = results[0];
        portfolio = results[1];
        populateSymbolSelect();
        renderAll();
    } catch(e) {
        document.getElementById('kdRows').innerHTML = '<div class="empty">Could not load: ' + e.message + '</div>';
    }
}

function renderAll() {
    if (currentView === 'list') { render(); } else { renderMonth(); }
}

function setView(view) {
    currentView = view;
    document.getElementById('viewListBtn').classList.toggle('active', view === 'list');
    document.getElementById('viewMonthBtn').classList.toggle('active', view === 'month');
    document.getElementById('listView').style.display = view === 'list' ? 'block' : 'none';
    document.getElementById('monthView').style.display = view === 'month' ? 'block' : 'none';
    renderAll();
}

function populateSymbolSelect() {
    var sel = document.getElementById('kdSymbol');
    if (portfolio.length === 0) {
        sel.innerHTML = '<option value="">No portfolio positions yet</option>';
        return;
    }
    sel.innerHTML = portfolio.map(function(p) {
        return '<option value="' + esc(p.symbol) + '" data-name="' + esc(p.name) + '">' + esc(p.name) + ' (' + esc(p.symbol) + ')</option>';
    }).join('');
}

function buildFilters() {
    var counts = { all: allKeyDates.length };
    allKeyDates.forEach(function(k) { counts[k.eventType] = (counts[k.eventType]||0) + 1; });
    var types = ['all', 'earnings', 'dividend', 'exdividend', 'yutai', 'custom'];
    var html = '';
    types.forEach(function(t) {
        if (t !== 'all' && !counts[t]) return;
        var label = t === 'all' ? 'All' : TYPE_LABELS[t];
        html += '<button class="filter-btn' + (currentFilter===t?' active':'') + '" data-f="' + t + '">' + label + ' (' + (counts[t]||0) + ')</button>';
    });
    var row = document.getElementById('filterRow');
    row.innerHTML = html;
    row.querySelectorAll('[data-f]').forEach(function(btn) {
        btn.addEventListener('click', function() { currentFilter = btn.getAttribute('data-f'); render(); });
    });
}

function daysUntil(dateStr) {
    var today = new Date(); today.setHours(0,0,0,0);
    var d = new Date(dateStr + 'T00:00:00');
    return Math.round((d - today) / 86400000);
}

function render() {
    buildFilters();
    var el = document.getElementById('kdRows');
    if (allKeyDates.length === 0) {
        el.innerHTML = '<div class="empty">No key dates yet.<br>Click "+ Add date" or "Refresh" to auto-fetch earnings &amp; dividend dates.</div>';
        return;
    }
    var items = allKeyDates.filter(function(k) { return currentFilter === 'all' || k.eventType === currentFilter; });
    if (items.length === 0) {
        el.innerHTML = '<div class="empty">No ' + TYPE_LABELS[currentFilter] + ' dates.</div>';
        return;
    }
    items = items.slice().sort(function(a,b) { return a.date < b.date ? -1 : 1; });
    el.innerHTML = items.map(renderKdRow).join('');
    el.querySelectorAll('[data-del]').forEach(function(btn) {
        btn.addEventListener('click', function() { deleteKeyDate(parseInt(btn.getAttribute('data-del'))); });
    });
    el.querySelectorAll('[data-cal]').forEach(function(btn) {
        btn.addEventListener('click', function() { pushToCalendar(parseInt(btn.getAttribute('data-cal'))); });
    });
}

function renderKdRow(k) {
    var idx = allKeyDates.indexOf(k);
    var du = daysUntil(k.date);
    var cdClass = du < 0 ? 'past' : du === 0 ? 'today' : du <= 7 ? 'soon' : '';
    var cdText = du < 0 ? (Math.abs(du) + 'd ago') : du === 0 ? 'Today' : ('in ' + du + 'd');
    var sourceTag = k.source === 'auto' ? '<span class="kd-source-auto">&#9889; auto</span>' : '';
    var calBtn = k.calendarEventId
        ? '<span class="kd-btn" style="cursor:default;">&#10003; on cal</span>'
        : '<button class="kd-btn" data-cal="' + idx + '">+ cal</button>';
    return '<div class="kd-row">'
          + '<div class="kd-badge ' + k.eventType + '">' + TYPE_LABELS[k.eventType] + '</div>'
          + '<div class="kd-mid">'
          +   '<div class="kd-name">' + esc(k.name || k.symbol) + ' <span style="color:#456a68;font-weight:normal;">(' + esc(k.symbol) + ')</span></div>'
          +   '<div class="kd-meta">' + sourceTag + '</div>'
          +   (k.note ? '<div class="kd-note">' + esc(k.note) + '</div>' : '')
          + '</div>'
          + '<div class="kd-right">'
          +   '<div class="kd-date">' + fmtDateLong(k.date) + '</div>'
          +   '<div class="kd-countdown ' + cdClass + '">' + cdText + '</div>'
          +   '<div class="kd-actions">' + calBtn + '<button class="kd-btn del" data-del="' + idx + '">del</button></div>'
          + '</div>'
          + '</div>';
}

function shiftMonth(delta) {
    monthCursor.setMonth(monthCursor.getMonth() + delta);
    selectedDay = null;
    renderMonth();
}
function goToday() {
    monthCursor = new Date(); monthCursor.setDate(1);
    selectedDay = fmtISO(new Date());
    renderMonth();
}

function fmtISO(d) {
    var y = d.getFullYear(), m = ('0'+(d.getMonth()+1)).slice(-2), dd = ('0'+d.getDate()).slice(-2);
    return y + '-' + m + '-' + dd;
}

function renderMonth() {
    var year = monthCursor.getFullYear(), month = monthCursor.getMonth();
    var monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    document.getElementById('monthLabel').textContent = monthNames[month] + ' ' + year;

    var eventsByDay = {};
    allKeyDates.forEach(function(k) {
        if (!eventsByDay[k.date]) eventsByDay[k.date] = [];
        eventsByDay[k.date].push(k);
    });

    var firstOfMonth = new Date(year, month, 1);
    var startDow = firstOfMonth.getDay();
    var gridStart = new Date(year, month, 1 - startDow);
    var todayStr = fmtISO(new Date());

    var dowLabels = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    var html = dowLabels.map(function(d) { return '<div class="month-dow">' + d + '</div>'; }).join('');

    for (var i = 0; i < 42; i++) {
        var cellDate = new Date(gridStart); cellDate.setDate(gridStart.getDate() + i);
        var iso = fmtISO(cellDate);
        var isOtherMonth = cellDate.getMonth() !== month;
        var isToday = iso === todayStr;
        var isSelected = iso === selectedDay;
        var dayEvents = eventsByDay[iso] || [];
        var dotsHtml = dayEvents.slice(0, 6).map(function(e) {
            return '<div class="month-dot dot-' + e.eventType + '"></div>';
        }).join('');

        var cls = 'month-cell' + (isOtherMonth ? ' other-month' : '') + (isToday ? ' today' : '') + (isSelected ? ' selected' : '');
        html += '<div class="' + cls + '" data-date="' + iso + '">'
              +   '<div class="month-daynum">' + cellDate.getDate() + '</div>'
              +   '<div class="month-dots">' + dotsHtml + '</div>'
              + '</div>';

        if (i >= 34 && cellDate.getMonth() !== month && (i+1) % 7 === 0) break;
    }

    var gridEl = document.getElementById('monthGrid');
    gridEl.innerHTML = html;
    gridEl.querySelectorAll('.month-cell').forEach(function(cell) {
        cell.addEventListener('click', function() {
            selectedDay = cell.getAttribute('data-date');
            renderMonth();
        });
    });

    renderDayDetail(eventsByDay);
}

function renderDayDetail(eventsByDay) {
    var card = document.getElementById('dayDetailCard');
    if (!selectedDay) { card.style.display = 'none'; return; }
    var events = eventsByDay[selectedDay] || [];
    card.style.display = 'block';
    document.getElementById('dayDetailTitle').textContent = fmtDateLong(selectedDay) + ' (' + events.length + ')';
    var rowsEl = document.getElementById('dayDetailRows');
    if (events.length === 0) {
        rowsEl.innerHTML = '<div class="empty" style="padding:14px 0;">No key dates on this day.</div>';
        return;
    }
    rowsEl.innerHTML = events.map(renderKdRow).join('');
    rowsEl.querySelectorAll('[data-del]').forEach(function(btn) {
        btn.addEventListener('click', function() { deleteKeyDate(parseInt(btn.getAttribute('data-del'))); });
    });
    rowsEl.querySelectorAll('[data-cal]').forEach(function(btn) {
        btn.addEventListener('click', function() { pushToCalendar(parseInt(btn.getAttribute('data-cal'))); });
    });
}

function openAddModal() {
    document.getElementById('kdDate').value = new Date().toISOString().split('T')[0];
    document.getElementById('kdNote').value = '';
    document.getElementById('kdType').value = 'earnings';
    document.getElementById('kdPushCal').checked = true;
    document.getElementById('addModal').classList.add('active');
}
function closeAddModal() { document.getElementById('addModal').classList.remove('active'); }

async function saveKeyDate() {
    var sel = document.getElementById('kdSymbol');
    var opt = sel.options[sel.selectedIndex];
    var symbol = sel.value;
    var name = opt ? opt.getAttribute('data-name') : '';
    var eventType = document.getElementById('kdType').value;
    var date = document.getElementById('kdDate').value;
    var note = document.getElementById('kdNote').value.trim();
    var pushToCalendar = document.getElementById('kdPushCal').checked;
    if (!symbol) { alert('Add a stock to your portfolio first.'); return; }
    if (!date) { alert('Pick a date.'); return; }
    try {
        allKeyDates = await gasRun('addKeyDateFromClient', { symbol: symbol, name: name, eventType: eventType, date: date, note: note, source: 'manual', pushToCalendar: pushToCalendar });
        closeAddModal();
        renderAll();
    } catch(e) { alert('Failed to add: ' + e.message); }
}

async function deleteKeyDate(idx) {
    var k = allKeyDates[idx];
    if (!confirm('Remove ' + TYPE_LABELS[k.eventType] + ' date for ' + (k.name||k.symbol) + '?')) return;
    try {
        allKeyDates = await gasRun('deleteKeyDateFromClient', idx);
        renderAll();
    } catch(e) { alert('Failed: ' + e.message); }
}

async function pushToCalendar(idx) {
    try {
        allKeyDates = await gasRun('pushKeyDateToCalendarFromClient', idx);
        renderAll();
    } catch(e) { alert('Failed: ' + e.message); }
}

async function refreshFromPortfolio() {
    var btn = document.getElementById('refreshBtn');
    btn.textContent = 'Fetching...';
    btn.disabled = true;
    try {
        allKeyDates = await gasRun('fetchKeyDatesForPortfolioFromClient');
        renderAll();
        btn.textContent = 'Refreshed!';
        setTimeout(function() { btn.innerHTML = '&#8635; Refresh'; btn.disabled = false; }, 2000);
    } catch(e) {
        alert('Failed: ' + e.message);
        btn.innerHTML = '&#8635; Refresh';
        btn.disabled = false;
    }
}

function esc(s) { var d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
function fmtDateLong(dateStr) {
    if (!dateStr) return '';
    var d = new Date(dateStr + 'T00:00:00');
    if (isNaN(d.getTime())) return String(dateStr);
    return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}

var _baseUrl = '';
function initNav() {
    gasRun('getDeploymentUrl').then(function(url) { _baseUrl = url; }).catch(function() { _baseUrl = ''; });
}
function navigate(page) {
    var url = _baseUrl || window.top.location.href.split('?')[0];
    window.top.location.href = url + '?page=' + page;
}
initNav();
init();
</script>
</body>
</html>
