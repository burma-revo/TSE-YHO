<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSE Tracker - Sales History</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #050b14; color: #e0e0e0; min-height: 100vh; padding: 20px; position: relative; }
        body::before, body::after { content: ''; position: fixed; width: 280px; height: 280px; border-radius: 50%; z-index: -1; pointer-events: none; }
        body::before { top: -100px; right: -100px; background: radial-gradient(circle, rgba(0,255,220,0.10), transparent 70%); }
        body::after { bottom: -100px; left: -100px; background: radial-gradient(circle, rgba(120,80,255,0.08), transparent 70%); }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 4px; font-size: 1.8rem; letter-spacing: 1px; background: linear-gradient(90deg, #00ffdd, #7f7bff); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .subtitle { text-align: center; color: #5ad9c9; margin-bottom: 24px; font-size: 0.85rem; letter-spacing: 1px; text-transform: uppercase; }
        .nav-links { display: flex; justify-content: center; gap: 10px; margin-bottom: 28px; flex-wrap: wrap; }
        .nav-link { color: #7fb8b6; font-size: 0.85rem; border: 1px solid rgba(223,247,242,0.12); padding: 5px 14px; border-radius: 20px; transition: all 0.2s; background: none; cursor: pointer; }
        .nav-link:hover { border-color: #00ffdd; color: #00ffdd; }
        .nav-link.active { border-color: rgba(0,255,220,0.5); color: #00ffdd; background: rgba(0,255,220,0.08); box-shadow: 0 0 10px rgba(0,255,220,0.25); }
        .card { background: rgba(255,255,255,0.03); border: 1px solid rgba(0,255,220,0.2); border-radius: 14px; padding: 20px; margin-bottom: 20px; backdrop-filter: blur(6px); box-shadow: 0 0 24px rgba(0,255,220,0.05); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
        .card-title { font-size: 1.1rem; font-weight: bold; color: #00ffdd; text-shadow: 0 0 8px rgba(0,255,220,0.3); }
        .chart-wrap { position: relative; height: 200px; }
        .chart-hover-info { height: 24px; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; font-size: 0.82rem; color: #7fb8b6; }
        .hover-up { font-family: 'Consolas', 'Courier New', monospace; font-size: 1rem; font-weight: bold; color: #00ffb0; }
        .hover-down { font-family: 'Consolas', 'Courier New', monospace; font-size: 1rem; font-weight: bold; color: #ff5c7a; }
        .filter-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
        .filter-btn { background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; color: #7fb8b6; cursor: pointer; padding: 4px 12px; font-size: 0.8rem; transition: all 0.2s; }
        .filter-btn:hover { border-color: #00ffdd; color: #00ffdd; }
        .filter-btn.active { background: linear-gradient(90deg, #00ffdd, #00c9a8); border-color: transparent; color: #04342c; font-weight: bold; box-shadow: 0 0 10px rgba(0,255,220,0.25); }
        .rows { max-height: 420px; overflow-y: auto; }
        .rows::-webkit-scrollbar { width: 6px; }
        .rows::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 3px; }
        .rows::-webkit-scrollbar-thumb { background: rgba(0,255,220,0.3); border-radius: 3px; }
        .rows::-webkit-scrollbar-thumb:hover { background: #00ffdd; }
        .sale-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 12px 14px; background: rgba(0,0,0,0.25); border-radius: 10px; border: 1px solid rgba(255,255,255,0.06); margin-bottom: 8px; align-items: center; transition: border-color 0.2s, box-shadow 0.2s; }
        .sale-row:hover { border-color: rgba(0,255,220,0.3); box-shadow: 0 0 10px rgba(0,255,220,0.08); }
        .row-left { min-width: 0; }
        .row-top { display: flex; align-items: baseline; gap: 10px; margin-bottom: 5px; }
        .stock-name { font-weight: bold; color: #fff; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
        .stock-sym { color: #456a68; font-size: 0.78rem; }
        .row-bottom { display: flex; gap: 14px; flex-wrap: wrap; }
        .meta-pill { font-size: 0.75rem; color: #7fb8b6; font-family: 'Consolas', 'Courier New', monospace; }
        .meta-hl { color: #8fd4d1; }
        .price-arrow { color: #456a68; margin: 0 2px; }
        .row-right { text-align: right; display: flex; flex-direction: column; align-items: flex-end; justify-content: center; gap: 2px; min-width: 110px; font-family: 'Consolas', 'Courier New', monospace; }
        .pl-amount { font-weight: bold; font-size: 0.95rem; }
        .pl-pct-text { font-size: 0.78rem; }
        .pl-positive { color: #00ffb0; text-shadow: 0 0 6px rgba(0,255,176,0.3); }
        .pl-negative { color: #ff5c7a; text-shadow: 0 0 6px rgba(255,60,90,0.3); }
        .pl-zero { color: #7fb8b6; }
        .summary { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.08); }
        .sum-label { color: #456a68; font-size: 0.72rem; margin-bottom: 4px; }
        .sum-value { font-family: 'Consolas', 'Courier New', monospace; font-weight: bold; font-size: 0.95rem; color: #fff; margin-bottom: 5px; }
        .hero-value { font-family: 'Consolas', 'Courier New', monospace; font-size: 1.5rem; font-weight: 800; margin-bottom: 2px; line-height: 1.1; }
        .hero-sub { font-size: 0.7rem; color: #456a68; margin-bottom: 5px; }
        .trend-caption { font-size: 0.7rem; margin-bottom: 5px; font-family: 'Consolas', 'Courier New', monospace; }
        .trend-up { color: #00ffb0; }
        .trend-down { color: #ff5c7a; }
        .fill-bar { height: 4px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; }
        .fill-inner { height: 4px; border-radius: 2px; }
        .stacked-bar { height: 6px; border-radius: 3px; display: flex; overflow: hidden; }
        .stacked-win { background: #00ffb0; box-shadow: 0 0 6px rgba(0,255,176,0.4); }
        .stacked-loss { background: #ff5c7a; box-shadow: 0 0 6px rgba(255,60,90,0.4); }
        .empty { color: #456a68; text-align: center; padding: 30px 0; font-size: 0.9rem; }
        .export-btn { background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.08); border-radius: 6px; color: #7fb8b6; cursor: pointer; padding: 5px 12px; font-size: 0.8rem; transition: all 0.2s; }
        .export-btn:hover { border-color: #00ffdd; color: #00ffdd; box-shadow: 0 0 8px rgba(0,255,220,0.2); }
        .combined-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
        .combined-item { background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 12px 14px; text-align: center; }
        .combined-item.highlight { border-color: rgba(0,255,220,0.4); box-shadow: 0 0 14px rgba(0,255,220,0.1); }
        .combined-item .sum-value { font-size: 1.2rem; margin-bottom: 0; }
        .stock-sym.clickable { cursor: pointer; text-decoration: underline; text-decoration-color: rgba(90,217,201,0.4); }
        .stock-sym.clickable:hover { color: #00ffdd; text-decoration-color: #00ffdd; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.75); z-index: 1000; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(3px); }
        .modal-overlay.active { display: flex; }
        .symbol-modal { background: rgba(10,20,25,0.92); border: 1px solid rgba(0,255,220,0.25); border-radius: 14px; padding: 22px 26px; width: 100%; max-width: 420px; backdrop-filter: blur(8px); box-shadow: 0 0 30px rgba(0,255,220,0.1); }
        .symbol-modal-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 18px; }
        .symbol-modal-name { font-size: 1.15rem; color: #fff; }
        .symbol-modal-sym { font-family: 'Consolas', 'Courier New', monospace; font-size: 0.75rem; color: #456a68; }
        .symbol-modal-close { color: #456a68; font-size: 1.3rem; cursor: pointer; line-height: 1; }
        .symbol-modal-close:hover { color: #00ffdd; }
        .symbol-modal-stats { display: flex; gap: 28px; margin-bottom: 20px; font-family: 'Consolas', 'Courier New', monospace; }
        .symbol-modal-stats .sum-label { font-size: 0.65rem; }
        .symbol-modal-stats .sum-value { font-size: 1.25rem; }
        .symbol-chart-label { font-size: 0.68rem; color: #456a68; margin-bottom: 8px; }
        .symbol-chart-scroll { overflow-x: auto; overflow-y: hidden; padding-bottom: 4px; }
        .symbol-chart-scroll::-webkit-scrollbar { height: 6px; }
        .symbol-chart-scroll::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 3px; }
        .symbol-chart-scroll::-webkit-scrollbar-thumb { background: rgba(0,255,220,0.3); border-radius: 3px; }
        .symbol-chart-inner { display: flex; align-items: flex-end; gap: 10px; height: 110px; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .symbol-chart-bar-wrap { flex: 0 0 44px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; position: relative; }
        .symbol-chart-bar { width: 100%; border-radius: 4px 4px 0 0; min-height: 3px; }
        .symbol-chart-bar.neg { border-radius: 0 0 4px 4px; }
        .symbol-chart-labels { display: flex; gap: 10px; font-family: 'Consolas', 'Courier New', monospace; font-size: 0.62rem; color: #456a68; margin-top: 6px; }
        .symbol-chart-labels span { flex: 0 0 44px; text-align: center; }
        @media (max-width: 600px) {
            .summary { grid-template-columns: repeat(2,1fr); }
            .combined-grid { grid-template-columns: 1fr; }
            .sale-row { grid-template-columns: 1fr; }
            .row-right { align-items: flex-start; flex-direction: row; flex-wrap: wrap; gap: 8px; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Tokyo Stock Exchange</h1>
    <p class="subtitle">Sales History</p>
    <div class="nav-links">
        <button class="nav-link" onclick="navigate('portfolio')">Portfolio</button>
        <button class="nav-link" onclick="navigate('growth')">Growth</button>
        <button class="nav-link active" onclick="navigate('history')">History</button>
        <button class="nav-link" onclick="navigate('watchlist')">Watchlist</button>
        <button class="nav-link" onclick="navigate('calendar')">Calendar</button>
        <button class="nav-link" onclick="navigate('reentry')">Re-entry</button>
    </div>

    <div class="card" id="combinedCard" style="display:none;">
        <div class="card-header">
            <div class="card-title">Portfolio P&amp;L</div>
        </div>
        <div class="combined-grid">
            <div class="combined-item"><div class="sum-label">Realized (all-time)</div><div class="sum-value" id="combinedRealized">--</div></div>
            <div class="combined-item"><div class="sum-label">Unrealized (current)</div><div class="sum-value" id="combinedUnrealized">--</div></div>
            <div class="combined-item highlight"><div class="sum-label">Combined Total</div><div class="sum-value" id="combinedTotal">--</div></div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <div class="card-title">Sales</div>
            <button class="export-btn" onclick="exportCSV()">Export CSV</button>
        </div>
        <div class="filter-row" id="filterRow"></div>
        <div class="rows" id="saleRows"><div class="empty">Loading...</div></div>
        <div class="summary" id="summary" style="display:none;"></div>
    </div>

    <div class="card" id="chartCard" style="display:none;">
        <div class="card-header">
            <div class="card-title">Monthly P&amp;L</div>
            <span style="font-size:0.8rem;color:#456a68;" id="chartYearLabel"></span>
        </div>
        <div class="chart-hover-info" id="chartHoverInfo">&nbsp;</div>
        <div class="chart-wrap"><canvas id="monthlyChart"></canvas></div>
    </div>

</div>

<div class="modal-overlay" id="symbolModal" onclick="if(event.target===this) closeSymbolModal();">
    <div class="symbol-modal">
        <div class="symbol-modal-head">
            <div>
                <div class="symbol-modal-name" id="symbolModalName"></div>
                <div class="symbol-modal-sym" id="symbolModalSym"></div>
            </div>
            <span class="symbol-modal-close" onclick="closeSymbolModal()">&times;</span>
        </div>
        <div class="symbol-modal-stats">
            <div><div class="sum-label">Realized</div><div class="sum-value" id="symbolModalRealized">--</div></div>
            <div><div class="sum-label">Win rate</div><div class="sum-value" id="symbolModalWinRate">--</div></div>
            <div><div class="sum-label">Avg hold</div><div class="sum-value" id="symbolModalAvgHold">--</div></div>
        </div>
        <div class="symbol-chart-label">P&amp;L per trade</div>
        <div class="symbol-chart-scroll">
            <div id="symbolChartArea"></div>
        </div>
    </div>
</div>

<script>
function gasRun(fnName) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function(resolve, reject) {
        var runner = google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject);
        runner[fnName].apply(runner, args);
    });
}

var allSales = [];
var currentFilter = 'all';
var monthlyChart = null;

async function init() {
    try {
        allSales = await gasRun('getAllSales');
        render();
        renderMonthlyChart();
    } catch(e) {
        document.getElementById('saleRows').innerHTML = '<div class="empty">Could not load: ' + e.message + '</div>';
    }
    loadCombinedPL();
}

// Combined Realized + Unrealized P&L, so "portfolio health" isn't split
// across two pages — realized comes from all-time Sales, unrealized from
// current holdings at live prices (same calc as the Portfolio page).
async function loadCombinedPL() {
    var card = document.getElementById('combinedCard');
    try {
        var totalRealized = allSales.reduce(function(sum, s) { return sum + (Number(s.profit) || 0); }, 0);

        var portfolio = await gasRun('getAllPositions');
        var totalUnrealized = 0;
        if (portfolio.length > 0) {
            var symbols  = portfolio.map(function(p) { return p.symbol; });
            var priceMap = await gasRun('fetchAllPrices', symbols);
            portfolio.forEach(function(p) {
                var price = priceMap[p.symbol];
                if (price != null) totalUnrealized += (price - p.buyPrice) * p.shares;
            });
        }

        var combinedTotal = totalRealized + totalUnrealized;
        setPl('combinedRealized', totalRealized);
        setPl('combinedUnrealized', totalUnrealized);
        setPl('combinedTotal', combinedTotal);
        card.style.display = 'block';
    } catch (e) {
        card.style.display = 'none';
    }
}
function setPl(id, val) {
    var el = document.getElementById(id);
    var cls = val > 0 ? 'pl-positive' : val < 0 ? 'pl-negative' : 'pl-zero';
    el.className = 'sum-value ' + cls;
    el.textContent = (val >= 0 ? '+' : '-') + '¥' + fmt(Math.abs(val));
}

function buildFilters() {
    var years = {};
    allSales.forEach(function(s) {
        if (s.sellDate) { var y = s.sellDate.slice(0,4); years[y] = (years[y]||0)+1; }
    });
    var html = '<button class="filter-btn' + (currentFilter==='all' ? ' active' : '') + '" data-f="all">All (' + allSales.length + ')</button>';
    Object.keys(years).sort().reverse().forEach(function(y) {
        html += '<button class="filter-btn' + (currentFilter===y ? ' active' : '') + '" data-f="' + y + '">' + y + ' (' + years[y] + ')</button>';
    });
    var row = document.getElementById('filterRow');
    row.innerHTML = html;
    row.querySelectorAll('[data-f]').forEach(function(btn) {
        btn.addEventListener('click', function() { setFilter(btn.getAttribute('data-f')); });
    });
}

function setFilter(val) { currentFilter = val; render(); renderMonthlyChart(); }

function render() {
    if (allSales.length === 0) {
        document.getElementById('saleRows').innerHTML = '<div class="empty">No sales yet.</div>';
        document.getElementById('summary').style.display = 'none';
        return;
    }
    buildFilters();
    var sales = allSales.filter(function(s) {
        return currentFilter === 'all' || (s.sellDate && s.sellDate.slice(0,4) === currentFilter);
    });
    if (sales.length === 0) {
        document.getElementById('saleRows').innerHTML = '<div class="empty">No sales in ' + currentFilter + '.</div>';
        document.getElementById('summary').style.display = 'none';
        return;
    }
    var html = '';
    var totalProfit = 0, wins = 0, losses = 0;
    sales.slice().reverse().forEach(function(s) {
        var profit   = Number(s.profit)||0;
        var invested = Number(s.buyPrice)*Number(s.shares);
        var plPct    = invested > 0 ? (profit/invested)*100 : 0;
        var plClass  = profit > 0 ? 'pl-positive' : profit < 0 ? 'pl-negative' : 'pl-zero';
        var plSign   = profit >= 0 ? '+' : '';
        totalProfit  += profit;
        if (profit > 0) wins++;
        else if (profit < 0) losses++;
        var buyFmt  = s.buyDate  ? fmtDate(s.buyDate)  : '';
        var sellFmt = s.sellDate ? fmtDate(s.sellDate) : '';
        html += '<div class="sale-row">'
              + '<div class="row-left">'
              +   '<div class="row-top"><div class="stock-name">' + esc(s.name||s.symbol) + '</div><div class="stock-sym clickable" onclick="openSymbolModal(\'' + esc(s.symbol).replace(/'/g,"\\'") + '\')">' + esc(s.symbol) + '</div></div>'
              +   '<div class="row-bottom">'
              +     '<div class="meta-pill">' + s.shares + ' shares</div>'
              +     '<div class="meta-pill"><span class="meta-hl">' + fmt(s.buyPrice) + '</span><span class="price-arrow">&#8594;</span><span class="meta-hl">' + fmt(s.sellPrice) + '</span></div>'
              +     (buyFmt&&sellFmt ? '<div class="meta-pill">' + buyFmt + ' to ' + sellFmt + '</div>' : '')
              +   '</div>'
              + '</div>'
              + '<div class="row-right">'
              +   '<div class="pl-amount ' + plClass + '">' + plSign + fmt(Math.abs(profit)) + '</div>'
              +   '<div class="pl-pct-text ' + plClass + '">(' + plSign + plPct.toFixed(1) + '%)</div>'
              + '</div>'
              + '</div>';
    });
    document.getElementById('saleRows').innerHTML = html;

    var totalClass = totalProfit > 0 ? 'pl-positive' : totalProfit < 0 ? 'pl-negative' : 'pl-zero';
    var totalSign  = totalProfit >= 0 ? '+' : '';
    var winRate    = (wins + losses) > 0 ? Math.round((wins/(wins+losses))*100) : 0;

    // Trend caption: compare this year's realized total to the prior year's,
    // only meaningful when a specific year is selected (not "all").
    var trendHtml = '';
    if (currentFilter !== 'all') {
        var prevYear = String(Number(currentFilter) - 1);
        var prevTotal = allSales
            .filter(function(s) { return s.sellDate && s.sellDate.slice(0,4) === prevYear; })
            .reduce(function(sum, s) { return sum + (Number(s.profit)||0); }, 0);
        var hasPrev = allSales.some(function(s) { return s.sellDate && s.sellDate.slice(0,4) === prevYear; });
        if (hasPrev) {
            var diff = totalProfit - prevTotal;
            var trendCls = diff >= 0 ? 'trend-up' : 'trend-down';
            var arrow = diff >= 0 ? '&#9650;' : '&#9660;';
            trendHtml = '<div class="trend-caption ' + trendCls + '">' + arrow + ' ' + (diff>=0?'+':'-') + '¥' + fmt(Math.abs(diff)) + ' vs ' + prevYear + '</div>';
        }
    }

    // Avg holding period: days between buy and sell, averaged over sales
    // that have both dates.
    var holdDurations = sales
        .filter(function(s) { return s.buyDate && s.sellDate; })
        .map(function(s) { return (new Date(s.sellDate+'T00:00:00') - new Date(s.buyDate+'T00:00:00')) / 86400000; })
        .filter(function(d) { return !isNaN(d); });
    var avgHoldDays = holdDurations.length > 0
        ? Math.round(holdDurations.reduce(function(a,b){return a+b;},0) / holdDurations.length)
        : null;

    // Profit factor: gross profit / gross loss. More honest than avg %
    // return, which one huge outlier trade can skew wildly.
    var grossProfit = sales.filter(function(s){return (Number(s.profit)||0) > 0;}).reduce(function(sum,s){return sum+Number(s.profit);},0);
    var grossLoss   = Math.abs(sales.filter(function(s){return (Number(s.profit)||0) < 0;}).reduce(function(sum,s){return sum+Number(s.profit);},0));
    var profitFactorText;
    if (grossLoss > 0) profitFactorText = (grossProfit/grossLoss).toFixed(2);
    else profitFactorText = grossProfit > 0 ? '&#8734;' : '--';

    var summaryEl = document.getElementById('summary');
    summaryEl.style.display = 'grid';
    summaryEl.innerHTML =
        '<div><div class="sum-label">Realized P&L</div><div class="hero-value ' + totalClass + '">' + totalSign + fmt(Math.abs(totalProfit)) + '</div><div class="hero-sub">' + sales.length + ' sale' + (sales.length===1?'':'s') + '</div>' + trendHtml + '</div>'
      + '<div><div class="sum-label">Avg Holding Period</div><div class="sum-value">' + (avgHoldDays != null ? avgHoldDays + 'd' : '--') + '</div></div>'
      + '<div><div class="sum-label">Profit Factor</div><div class="sum-value">' + profitFactorText + '</div></div>'
      + '<div><div class="sum-label">Win rate</div><div class="sum-value">' + winRate + '%</div><div class="stacked-bar"><div class="stacked-win" style="flex:' + winRate + '"></div><div class="stacked-loss" style="flex:' + (100-winRate) + '"></div></div></div>';
}

function renderMonthlyChart() {
    var sales = allSales.filter(function(s) {
        return currentFilter === 'all' || (s.sellDate && s.sellDate.slice(0,4) === currentFilter);
    });
    var chartCard = document.getElementById('chartCard');
    if (sales.length === 0) { chartCard.style.display = 'none'; return; }
    chartCard.style.display = 'block';

    var months, labels;
    var mNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    if (currentFilter !== 'all') {
        months = []; labels = [];
        for (var m = 0; m < 12; m++) {
            months.push(currentFilter + '-' + ('0'+(m+1)).slice(-2));
            labels.push(mNames[m]);
        }
        document.getElementById('chartYearLabel').textContent = currentFilter;
    } else {
        months = []; labels = [];
        var allDates = sales.map(function(s) { return s.sellDate||''; }).filter(Boolean).sort();
        var latest = allDates[allDates.length-1];
        var d = new Date(latest + 'T00:00:00');
        for (var i = 11; i >= 0; i--) {
            var dd = new Date(d.getFullYear(), d.getMonth()-i, 1);
            months.push(dd.getFullYear() + '-' + ('0'+(dd.getMonth()+1)).slice(-2));
            labels.push(mNames[dd.getMonth()] + ' ' + String(dd.getFullYear()).slice(2));
        }
        document.getElementById('chartYearLabel').textContent = 'last 12 months';
    }

    var profits = months.map(function() { return 0; });
    sales.forEach(function(s) {
        if (!s.sellDate) return;
        var idx = months.indexOf(s.sellDate.slice(0,7));
        if (idx !== -1) profits[idx] += (Number(s.profit)||0);
    });

    var bgColors     = profits.map(function(p) { return p >= 0 ? 'rgba(0,255,176,0.7)' : 'rgba(255,60,90,0.7)'; });
    var hoverColors  = profits.map(function(p) { return p >= 0 ? '#00ffb0' : '#ff5c7a'; });

    if (monthlyChart) monthlyChart.destroy();
    var hoverInfo = document.getElementById('chartHoverInfo');

    monthlyChart = new Chart(document.getElementById('monthlyChart').getContext('2d'), {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{ data: profits, backgroundColor: bgColors, hoverBackgroundColor: hoverColors, borderRadius: 4, borderSkipped: false }]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            interaction: { intersect: false, mode: 'index' },
            onHover: function(event, elements) {
                if (elements.length > 0) {
                    var idx = elements[0].index;
                    var p   = profits[idx];
                    var sign = p >= 0 ? '+' : '';
                    var cls  = p >= 0 ? 'hover-up' : 'hover-down';
                    if (p === 0) { hoverInfo.innerHTML = '<span style="color:#7fb8b6">' + labels[idx] + '</span> <span style="color:#7fb8b6">no sales</span>'; return; }
                    hoverInfo.innerHTML = '<span style="color:#7fb8b6">' + labels[idx] + '</span> <span class="' + cls + '">' + sign + fmtAbs(p) + '</span>';
                } else { hoverInfo.innerHTML = ' '; }
            },
            plugins: { legend: { display: false }, tooltip: { enabled: false } },
            scales: {
                x: { ticks: { color:'#456a68', maxRotation:0, font:{size:11} }, grid: { color:'rgba(255,255,255,0.05)' } },
                y: {
                    ticks: { color:'#456a68', callback: function(v) {
                        if (Math.abs(v)>=1000000) return (v/1000000).toFixed(1)+'M';
                        if (Math.abs(v)>=1000) return (v/1000).toFixed(0)+'k';
                        return v;
                    }},
                    grid: { color:'rgba(255,255,255,0.05)' }
                }
            }
        }
    });
    document.getElementById('monthlyChart').addEventListener('mouseleave', function() { hoverInfo.innerHTML = ' '; });
}

function exportCSV() {
    if (allSales.length === 0) { alert('No sales to export.'); return; }
    var rows = ['Symbol,Name,Shares,Buy Price,Sell Price,Buy Date,Sell Date,Profit'];
    allSales.forEach(function(s) {
        rows.push([s.symbol, '"'+(s.name||'').replace(/"/g,'""')+'"', s.shares, s.buyPrice, s.sellPrice, s.buyDate, s.sellDate, Number(s.profit).toFixed(0)].join(','));
    });
    var nl = String.fromCharCode(10); var blob = new Blob([rows.join(nl)], { type:'text/csv' })
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'tse-sales-history.csv';
    a.click();
}

// Per-symbol popup: aggregates ALL of that symbol's closed trades (all-time,
// not scoped to the current year filter) so it reflects the full track record.
function openSymbolModal(symbol) {
    var trades = allSales.filter(function(s) { return s.symbol === symbol; });
    if (!trades.length) return;
    var name = trades[trades.length - 1].name || symbol;

    document.getElementById('symbolModalName').textContent = name;
    document.getElementById('symbolModalSym').textContent = symbol;

    var totalProfit = trades.reduce(function(sum, s) { return sum + (Number(s.profit)||0); }, 0);
    var wins = trades.filter(function(s) { return (Number(s.profit)||0) > 0; }).length;
    var losses = trades.filter(function(s) { return (Number(s.profit)||0) < 0; }).length;
    var winRate = (wins + losses) > 0 ? Math.round((wins/(wins+losses))*100) : null;

    var holdDurations = trades
        .filter(function(s) { return s.buyDate && s.sellDate; })
        .map(function(s) { return (new Date(s.sellDate+'T00:00:00') - new Date(s.buyDate+'T00:00:00')) / 86400000; })
        .filter(function(d) { return !isNaN(d); });
    var avgHoldDays = holdDurations.length > 0
        ? Math.round(holdDurations.reduce(function(a,b){return a+b;},0) / holdDurations.length)
        : null;

    var realizedEl = document.getElementById('symbolModalRealized');
    realizedEl.className = 'sum-value ' + (totalProfit > 0 ? 'pl-positive' : totalProfit < 0 ? 'pl-negative' : 'pl-zero');
    realizedEl.textContent = (totalProfit >= 0 ? '+' : '-') + '¥' + fmt(Math.abs(totalProfit));
    document.getElementById('symbolModalWinRate').textContent = winRate != null ? winRate + '%' : '--';
    document.getElementById('symbolModalAvgHold').textContent = avgHoldDays != null ? avgHoldDays + 'd' : '--';

    renderSymbolChart(trades);
    document.getElementById('symbolModal').classList.add('active');
}

function closeSymbolModal() {
    document.getElementById('symbolModal').classList.remove('active');
}

function renderSymbolChart(trades) {
    var sorted = trades.slice().sort(function(a, b) {
        return (a.sellDate||'').localeCompare(b.sellDate||'');
    });
    var maxAbs = Math.max.apply(null, sorted.map(function(s) { return Math.abs(Number(s.profit)||0); })) || 1;

    var barsHtml = '', labelsHtml = '';
    sorted.forEach(function(s) {
        var profit = Number(s.profit)||0;
        var heightPct = Math.max(Math.round((Math.abs(profit)/maxAbs)*100), 3);
        var color = profit >= 0 ? '#00ffb0' : '#ff5c7a';
        var glow = profit >= 0 ? 'rgba(0,255,176,0.35)' : 'rgba(255,60,90,0.35)';
        barsHtml += '<div class="symbol-chart-bar-wrap" title="' + esc(s.sellDate ? fmtDate(s.sellDate) : '') + ': ' + (profit>=0?'+':'-') + '¥' + fmt(Math.abs(profit)) + '">'
                  +   '<div class="symbol-chart-bar' + (profit < 0 ? ' neg' : '') + '" style="height:' + heightPct + '%;background:' + color + ';box-shadow:0 0 8px ' + glow + ';"></div>'
                  + '</div>';
        labelsHtml += '<span>' + (s.sellDate ? fmtDate(s.sellDate) : '--') + '</span>';
    });

    document.getElementById('symbolChartArea').innerHTML =
        '<div class="symbol-chart-inner">' + barsHtml + '</div>'
      + '<div class="symbol-chart-labels">' + labelsHtml + '</div>';
}

function fmt(n) { if (n==null||isNaN(n)) return 'N/A'; return Number(n).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0}); }
function fmtAbs(n) { return Math.abs(Number(n)).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0}); }
function esc(s) { var d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
function fmtDate(dateStr) {
    if (!dateStr) return '';
    var d = new Date(dateStr.indexOf('T')!==-1 ? dateStr : dateStr+'T00:00:00');
    if (isNaN(d.getTime())) return String(dateStr);
    return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'2-digit'});
}

var _baseUrl = '';
function initNav() {
    gasRun('getDeploymentUrl').then(function(url) { _baseUrl = url; }).catch(function() { _baseUrl = ''; });
}
function navigate(page) {
    var url = _baseUrl || window.top.location.href.split('?')[0];
    window.top.location.href = url + '?page=' + page;
}
initNav();
init();
</script>
